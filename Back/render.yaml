services:
  - type: web
    name: panaderia-backend
    runtime: docker
    plan: free
    envVars:
      - key: APP_ENV
        value: production
      - key: ENABLE_DOCS
        value: "1"
      - key: LOG_LEVEL
        value: INFO
      - key: CORS_ORIGINS
        value: "*"
      - key: DATABASE_URL
        sync: false
